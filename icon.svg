<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fundo Premium Dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#141838" />
      <stop offset="100%" stop-color="#030611" />
    </linearGradient>

    <!-- Gradiente Vibrante do R (Índigo -> Roxo -> Rosa) -->
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="45%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Gradiente do texto 'epeat' (Branco Cristal -> Ciano Suave) -->
    <linearGradient id="epeatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <!-- Gradiente dos Anéis de Loop -->
    <linearGradient id="loopRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Filtro Neon Glow Principal -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" opacity="0.4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&amp;display=swap');
    .text-r {
      font-family: 'Outfit', 'Montserrat', 'Segoe UI', -apple-system, Roboto, sans-serif;
      font-weight: 900;
      font-size: 245px;
      fill: url(#rGrad);
      filter: url(#neonGlow);
    }
    .text-epeat {
      font-family: 'Outfit', 'Montserrat', 'Segoe UI', -apple-system, Roboto, sans-serif;
      font-weight: 800;
      font-size: 72px;
      letter-spacing: 3.5px;
      fill: url(#epeatGrad);
      filter: url(#subtleGlow);
    }
    .badge-label {
      font-family: 'Outfit', 'Montserrat', 'Segoe UI', -apple-system, Roboto, sans-serif;
      font-weight: 700;
      font-size: 19px;
      letter-spacing: 4px;
      fill: #38bdf8;
    }
  </style>

  <!-- Fundo Squircle com borda brilhante -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#loopRingGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Anel de Órbita de Loop Infinito Exterior -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#loopRingGrad)" stroke-width="5" stroke-dasharray="160 30 220 30" stroke-linecap="round" opacity="0.45" />

  <!-- Setas de Repetição Contínua no Fundo (Loop Icon) -->
  <g opacity="0.14" stroke="url(#rGrad)" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 115 175 A 170 170 0 0 1 395 175 L 415 155 M 395 175 L 415 195" />
    <path d="M 395 337 A 170 170 0 0 1 115 337 L 95 357 M 115 337 L 95 317" />
  </g>

  <!-- Letra R Grande em Destaque -->
  <text x="68" y="348" class="text-r">R</text>

  <!-- Letras 'epeat' Pequenas do Lado do R -->
  <text x="246" y="272" class="text-epeat">epeat</text>

  <!-- Elemento Decorativo: Barra de Loop e Badge PLAYER -->
  <g transform="translate(248, 296)">
    <!-- Barra divisória neon com gradiente -->
    <rect width="186" height="4" rx="2" fill="url(#loopRingGrad)" opacity="0.85" />
    
    <!-- Ícone de Play / Seta de Repetição -->
    <polygon points="4,16 14,23 4,30" fill="#38bdf8" />
    <circle cx="22" cy="23" r="3" fill="#818cf8" />
    <text x="34" y="29" class="badge-label">LOOP</text>
  </g>

  <!-- Pontos de Brilho / Detalhe Futurista -->
  <circle cx="238" cy="142" r="5" fill="#ffffff" filter="url(#subtleGlow)" />
  <circle cx="442" cy="242" r="3.5" fill="#38bdf8" filter="url(#subtleGlow)" opacity="0.8" />
</svg>
